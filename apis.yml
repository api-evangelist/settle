name: Settle
description: 'Settle is a financial operations platform built for consumer packaged
  goods (CPG) brands and ecommerce companies, unifying procurement, accounts payable
  automation, and working capital financing in one back office. Teams create and manage
  purchase orders, track goods received and true landed costs, collect and approve
  bills, pay vendors with real-time visibility, and access flexible inventory and
  growth financing ($20K-$15M) underwritten from payables and purchasing data. Founded
  in 2019 and backed by Ribbit Capital, Kleiner Perkins, and Founders Fund, Settle
  has funded more than $3 billion to brands. A developer API covering bill pay, payments,
  and landed-cost data is in early access via a public waitlist.'
